<svg xmlns="http://www.w3.org/2000/svg" width="560" height="100" viewBox="0 0 560 100" role="img" aria-label="Jackson Raj A, software developer and AI engineer">
  <title>Jackson Raj A | software developer, AI engineer</title>
  <style>
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .name { font-size: 34px; font-weight: 700; fill: #0969DA; }
    .prompt, .role { font-size: 20px; fill: #57606A; }
    .cursor { fill: #0969DA; }
    @media (prefers-color-scheme: dark) {
      .name { fill: #58A6FF; }
      .prompt, .role { fill: #8B949E; }
      .cursor { fill: #58A6FF; }
    }
  </style>

  <defs>
    <clipPath id="c0">
      <rect x="24" y="60" height="32" width="0">
        <animate attributeName="width" dur="9s" repeatCount="indefinite" calcMode="linear"
                 keyTimes="0;0.1333;0.3;0.3333;1" values="0;225;225;0;0" />
      </rect>
    </clipPath>
    <clipPath id="c1">
      <rect x="24" y="60" height="32" width="0">
        <animate attributeName="width" dur="9s" repeatCount="indefinite" calcMode="linear"
                 keyTimes="0;0.3333;0.4667;0.6333;0.6667;1" values="0;0;138;138;0;0" />
      </rect>
    </clipPath>
    <clipPath id="c2">
      <rect x="24" y="60" height="32" width="0">
        <animate attributeName="width" dur="9s" repeatCount="indefinite" calcMode="linear"
                 keyTimes="0;0.6667;0.8;0.9667;1" values="0;0;313;313;0" />
      </rect>
    </clipPath>
  </defs>

  <text class="name" x="4" y="40">Jackson Raj A</text>

  <text class="prompt" x="4" y="82">$</text>
  <text class="role" x="24" y="82" clip-path="url(#c0)">software developer</text>
  <text class="role" x="24" y="82" clip-path="url(#c1)">ai engineer</text>
  <text class="role" x="24" y="82" clip-path="url(#c2)">open to entry-level roles</text>

  <rect class="cursor" y="64" width="2" height="22" x="24">
    <animate attributeName="x" dur="9s" repeatCount="indefinite" calcMode="linear"
             keyTimes="0;0.1333;0.3;0.3333;0.4667;0.6333;0.6667;0.8;0.9667;1"
             values="24;249;249;24;162;162;24;337;337;24" />
    <animate attributeName="opacity" dur="1s" repeatCount="indefinite" calcMode="discrete"
             keyTimes="0;0.5" values="1;0" />
  </rect>
</svg>
